<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📻 Radio</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#0e0b1a;--tx:#f3f0ff;--mu:#9d95c4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 20% 0,#2a1750,#0e0b1a 60%) fixed;color:var(--tx);font:16px system-ui,sans-serif;text-align:center;padding:24px}
h1{margin:0;font-size:30px;background:linear-gradient(90deg,#ff4d8d,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff4d8d,#7c5cff);font-size:56px;box-shadow:0 0 0 0 rgba(255,77,141,.5)}
.on #ring{animation:p 1.6s infinite}@keyframes p{70%{box-shadow:0 0 0 30px rgba(255,77,141,0)}100%{box-shadow:0 0 0 0 rgba(255,77,141,0)}}
button{background:#fff;color:#1b1030;border:0;border-radius:40px;padding:16px 38px;font-size:18px;font-weight:700}
#t{color:var(--mu);min-height:22px;max-width:320px}
</style></head><body>
<h1>Radio</h1>
<div id="ring">🎧</div>
<div id="t">Dghet bach tsma3 l'DJ live</div>
<button id="b">▶ Écouter</button>
<button id="snd" style="display:none;background:linear-gradient(90deg,#ff4d8d,#7c5cff);color:#fff">🔊 Dghet bach tsm3</button>
<script>
const $=id=>document.getElementById(id);
const R=new URLSearchParams(location.search).get('r')||'radio';
let room=null,el=null;
const say=t=>$('t').textContent=t;
function stop(m){const r=room;room=null;if(r)r.disconnect();if(el){el.pause();el.srcObject=null;el.remove();el=null}document.body.classList.remove('on');$('snd').style.display='none';$('b').textContent='▶ Écouter';say(m||'Wa9ef')}
async function listen(){
  const L=LivekitClient,E=L.RoomEvent;
  // iOS: unlock audio playback inside the tap, before any await
  el=document.createElement('audio');el.setAttribute('playsinline','');el.autoplay=true;
  el.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  document.body.appendChild(el);el.play().catch(()=>{});
  say('Kan connecti…');
  try{
    const r=await fetch('/api/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role:'listener',room:R})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    room=new L.Room();
    const djHere=()=>[...room.remoteParticipants.values()].some(p=>p.identity==='dj');
    room.on(E.TrackSubscribed,t=>{if(t.kind!=='audio'||!el)return;el.removeAttribute('src');t.attach(el);
      el.play().then(()=>{$('snd').style.display='none'}).catch(()=>{$('snd').style.display=''});
      document.body.classList.add('on');say('Kat sma3 l\'DJ live 🔴')});
    room.on(E.TrackUnsubscribed,t=>{t.detach(el);document.body.classList.remove('on');say(djHere()?'Kan jib l\'son…':'L\'DJ wa9ef, kan tsnna…')});
    room.on(E.ParticipantConnected,p=>{if(p.identity==='dj')say('L\'DJ dkhel, kan jib l\'son…')});
    room.on(E.ParticipantDisconnected,p=>{if(p.identity==='dj'){document.body.classList.remove('on');say('L\'DJ kharaj. Kan tsnna…')}});
    room.on(E.AudioPlaybackStatusChanged,()=>{if(room&&!room.canPlayAudio)$('snd').style.display=''});
    room.on(E.Disconnected,()=>{if(room)stop('Connexion t9te3at. 3awed dghet Écouter.')});
    await room.connect(j.url,j.token);
    $('b').textContent='⏹ Stop';
    if(!document.body.classList.contains('on'))say(djHere()?'DJ live, kan jib l\'son…':'Connecté ✓ L\'DJ mazal ma dar Go Live, kan tsnna…');
  }catch(e){stop(e.message)}
}
$('snd').onclick=async()=>{try{await room.startAudio();await el.play();$('snd').style.display='none'}catch(e){}};
$('b').onclick=()=>room?stop():listen();
</script></body></html>
