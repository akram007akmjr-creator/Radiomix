<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📻 Pro DJ Studio</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#0a0a0c;--panel:#141418;--accent:#00ffaa;--text:#fff;}
body{background:var(--bg);color:var(--text);font-family:system-ui;margin:0;padding:10px}
.c{background:var(--panel);border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #222}
.row{display:flex;gap:10px;margin-bottom:10px}
input,button{background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;}
button{background:var(--accent);color:#000;font-weight:bold;cursor:pointer}
#playlist{max-height:150px;overflow-y:auto;background:#050505;padding:10px;border-radius:6px}
.track{padding:6px;border-bottom:1px solid #111;display:flex;justify-content:space-between}
.active-track{color:var(--accent);font-weight:bold}
</style>
</head>
<body>

<h1>📻 Pro DJ Studio</h1>

<div class="c">
  <h2>📺 YouTube Sync</h2>
  <div class="row">
    <input id="ytUrl" placeholder="Paste YouTube URL/ID" style="flex:1">
    <button onclick="loadYT()">Load</button>
  </div>
</div>

<div class="c">
  <h2>💽 Pro Automix Decks</h2>
  <input type="file" id="audioFileInput" multiple>
  <div id="playlist">No tracks loaded</div>
  <div class="row" style="margin-top:10px">
    <button onclick="startMix()" style="flex:1">▶ Start Pro Mix</button>
    <button onclick="skipTrack()" style="flex:1">⏭ Auto Mix Now</button>
  </div>
</div>

<div class="c">
  <h2>💬 Live Requests</h2>
  <div id="requestsBox">No requests yet...</div>
</div>

<div class="c">
  <h2>📡 Broadcast</h2>
  <div class="row">
    <input id="roomInput" placeholder="Room Name" value="radio">
    <input id="keyInput" type="password" placeholder="API Key">
  </div>
  <button id="broadcastBtn" onclick="toggleBroadcast()" style="width:100%">🔴 Go Live</button>
  <div id="status" style="margin-top:5px;font-size:12px">Ready</div>
</div>

<script>
let ytPlayer, audioCtx, decks = [], trackList = [], currentTrackIdx = -1;
let isMixing = false, crossfadeDuration = 6, broadcastRoom;

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayer', { height: '0', width: '0', videoId: 'jfKfPfyJRdk' });
}

document.getElementById('audioFileInput').addEventListener('change', e => {
  trackList = Array.from(e.target.files);
  renderPlaylist();
});

function renderPlaylist() {
  const container = document.getElementById('playlist');
  if(trackList.length === 0) return;
  container.innerHTML = trackList.map((t, i) => 
    `<div class="track ${i === currentTrackIdx ? 'active-track' : ''}"><span>${i+1}. ${t.name.substring(0,25)}</span></div>`
  ).join('');
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    for(let i=0; i<2; i++) {
      let gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      decks.push({ gain: gain, source: null, buffer: null });
    }
  }
}

function startMix() {
  if (trackList.length === 0) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  currentTrackIdx = 0;
  playTrack(currentTrackIdx, 0);
  isMixing = true;
}

function playTrack(trackIdx, delay) {
  const deck = decks[trackIdx % 2];
  const nextDeck = decks[(trackIdx + 1) % 2];
  const file = trackList[trackIdx];
  const reader = new FileReader();

  reader.onload = function(e) {
    audioCtx.decodeAudioData(e.target.result, buffer => {
      let source = audioCtx.createBufferSource();
      source.buffer = buffer;
      deck.buffer = buffer;
      deck.source = source;
      
      deck.gain.gain.setValueAtTime(0.001, audioCtx.currentTime + delay);
      deck.gain.gain.exponentialRampToValueAtTime(1, audioCtx.currentTime + delay + 2);
      
      source.connect(deck.gain);
      source.start(audioCtx.currentTime + delay);

      const duration = buffer.duration;
      const nextDelay = duration - crossfadeDuration;
      
      setTimeout(() => {
        if (isMixing && trackList.length > 1) {
          crossfadeDecks(deck, nextDeck);
          currentTrackIdx = (currentTrackIdx + 1) % trackList.length;
          renderPlaylist();
          playTrack(currentTrackIdx, crossfadeDuration);
        }
      }, (nextDelay + delay) * 1000);
    });
  };
  reader.readAsArrayBuffer(file);
}

function crossfadeDecks(outgoingDeck, incomingDeck) {
  const now = audioCtx.currentTime;
  outgoingDeck.gain.gain.setValueAtTime(outgoingDeck.gain.gain.value, now);
  outgoingDeck.gain.gain.linearRampToValueAtTime(0.001, now + crossfadeDuration);
}

function skipTrack() {
  if(!isMixing || trackList.length <= 1) return;
  const currentDeck = decks[currentTrackIdx % 2];
  const nextDeck = decks[(currentTrackIdx + 1) % 2];
  crossfadeDecks(currentDeck, nextDeck);
  currentTrackIdx = (currentTrackIdx + 1) % trackList.length;
  renderPlaylist();
  playTrack(currentTrackIdx, crossfadeDuration);
}

async function toggleBroadcast() {
  initAudio();
  const roomName = document.getElementById('roomInput').value;
  const apiKey = document.getElementById('keyInput').value;
  if(!apiKey) { alert('API Key required'); return; }
  
  const dest = audioCtx.createMediaStreamDestination();
  decks.forEach(d => d.gain.connect(dest));

  try {
    const res = await fetch('/api/token', {
      method:'POST', body: JSON.stringify({room: roomName, key: apiKey}),
      headers:{'Content-Type':'application/json'}
    });
    const data = await res.json();
    broadcastRoom = new LivekitClient.Room();
    await broadcastRoom.connect(data.url, data.token);
    await broadcastRoom.localParticipant.publishTrack(dest.stream.getAudioTracks()[0]);
    
    broadcastRoom.on(LivekitClient.RoomEvent.DataReceived, payload => {
      const msg = JSON.parse(new TextDecoder().decode(payload));
      if (msg.type === 'song_request') {
        document.getElementById('requestsBox').innerHTML += `<p>🎵 ${msg.song}</p>`;
      }
    });
    document.getElementById('status').innerText = "🟢 Broadcasting Live";
  } catch(e) {
    document.getElementById('status').innerText = "🔴 Error: " + e.message;
  }
}
</script>
</body>
</html>
