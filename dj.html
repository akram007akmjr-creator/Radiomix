<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>📻 Radio DJ - Complete Studio Pro + Smart FX</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #0e0b1a; --card: #191430; --tx: #f3f0ff; --mu: #9d95c4;
      --ac: #ff4d8d; --ac2: #7c5cff; --bd: #2e2750; color-scheme: dark;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; background: var(--bg); color: var(--tx);
      font: 15px system-ui, sans-serif; padding: 14px; max-width: 680px; margin: auto;
    }
    h1 {
      font-size: 25px; margin: 4px 0 12px;
      background: linear-gradient(90deg, var(--ac), var(--ac2));
      -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800;
    }
    h2 {
      font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--mu); margin: 0 0 10px; font-weight: 700;
    }
    .c {
      background: var(--card); border: 1px solid var(--bd); border-radius: 18px;
      padding: 16px; margin-bottom: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    button, label.b {
      background: #fff; color: #1b1030; border: 0; border-radius: 12px;
      padding: 12px 16px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s;
    }
    button.on { background: linear-gradient(90deg, var(--ac), var(--ac2)); color: #fff; }
    button:active { transform: scale(.96); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .s { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .s span { width: 92px; color: var(--mu); font-size: 13px; }
    .s input { flex: 1; accent-color: var(--ac); }

    /* YouTube Deck */
    #yt-container { width: 100%; height: 200px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 12px; position: relative; }
    #yt-player { width: 100%; height: 100%; pointer-events: none; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1; background: rgba(0,0,0,.4); border: 1px solid var(--bd); color: #fff;
      padding: 12px 14px; border-radius: 12px; outline: none; font-size: 14px; user-select: text; -webkit-user-select: text;
    }
    input:focus { border-color: var(--ac); }

    /* Smart FX & Sampler Grid (edjing style) */
    .fx-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .fx-tab {
      background: rgba(255,255,255,0.08); color: var(--tx); padding: 6px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 700;
    }
    .fx-tab.active { background: var(--ac2); color: #fff; }
    .fx-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .fx-pad {
      background: #110d22; border: 1px solid var(--bd); border-radius: 12px;
      height: 78px; padding: 10px; display: flex; flex-direction: column;
      justify-content: space-between; align-items: flex-start;
      color: var(--tx); font-size: 13px; font-weight: 700; position: relative;
      overflow: hidden; cursor: pointer; transition: 0.12s;
    }
    .fx-pad small { font-size: 10px; color: var(--mu); font-weight: 500; }
    .fx-pad i { align-self: flex-end; font-style: normal; font-size: 15px; opacity: 0.7; }
    .fx-pad.active, .fx-pad:active {
      border-color: var(--ac);
      background: linear-gradient(135deg, rgba(255,77,141,0.28), rgba(124,92,255,0.28));
      box-shadow: 0 0 16px rgba(255,77,141,0.45);
      transform: scale(0.96);
    }
    .pro-badge {
      font-size: 9px; background: rgba(16, 185, 129, 0.2); color: #10b981;
      padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(16,185,129,0.4);
    }

    /* List & Calls */
    #list, #calls, #songs { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
    .t, .item {
      padding: 10px 12px; background: rgba(0,0,0,.3); border-radius: 10px;
      border: 1px solid rgba(255,255,255,.05); display: flex; justify-content: space-between; align-items: center;
    }
    .t.cur { border-color: var(--ac); color: var(--ac); font-weight: 600; }
    .item { font-size: 14px; }
    .actions { display: flex; gap: 6px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-ac { background: #10b981; color: #fff; }
    .btn-dc { background: #ef4444; color: #fff; }
    #bar { height: 6px; background: var(--bd); border-radius: 3px; margin-top: 14px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ac), var(--ac2)); border-radius: 3px; transition: width 0.3s; }
  </style>
</head>
<body>

<h1>📻 Radio DJ - Complete Studio Pro</h1>

<!-- YouTube Deck -->
<div class="c">
  <h2>📺 YouTube Player Deck (Visual & Sync)</h2>
  <div id="yt-container"><div id="yt-player"></div></div>
  <div class="input-row">
    <input id="ytUrl" placeholder="Lien YouTube ou ID (ex: jNQXAC9IVRw)...">
    <button onclick="loadYouTubeLocal()">Charger</button>
  </div>
  <div class="row">
    <button onclick="broadcastYT('play')" style="flex:1">▶ Play for All</button>
    <button onclick="broadcastYT('pause')" style="flex:1">⏸ Pause for All</button>
  </div>
</div>

<!-- Smart FX & Grid FX Pad -->
<div class="c">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h2 style="margin:0">🎛️ Smart FX & Sampler Pad</h2>
    <span class="pro-badge">⚡ PRO UNLOCKED</span>
  </div>
  <div class="fx-grid">
    <div class="fx-pad" id="pad-siren" onclick="triggerSiren()">
      <i>🚨</i>
      <div>Siren<br><small>SFX Synth</small></div>
    </div>
    <div class="fx-pad" id="pad-riser" onclick="triggerRiser()">
      <i>🚀</i>
      <div>Riser<br><small>Drop Sweep</small></div>
    </div>
    <div class="fx-pad" id="pad-gate" onclick="toggleGate()">
      <i>🔪</i>
      <div>Gate<br><small>Beat Cut</small></div>
