<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📻 Radio DJ - Pro Studio</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#0e0b1a;--card:#191430;--tx:#f3f0ff;--mu:#9d95c4;--ac:#ff4d8d;--ac2:#7c5cff;--bd:#2e2750;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:14px;max-width:680px;margin:auto}
h1{font-size:26px;margin:4px 0 12px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;font-weight:700}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
button,label.b{background:#fff;color:#1b1030;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
button:active{transform:scale(.96)}
.row{display:flex;gap:8px;align-items:flex-wrap:wrap}
.s{display:flex;align-items:center;gap:10px;margin:12px 0}.s span{width:92px;color:var(--mu);font-size:13px}.s input{flex:1}

/* Video & Audio Control */
#yt-container{width:100%;height:220px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px}
.input-row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:#fff;padding:12px 14px;border-radius:12px;outline:none;font-size:14px}
input:focus{border-color:var(--ac)}
.btn-live{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;width:100%;padding:14px;font-size:16px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
#live.on{animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.65}}

/* Lists */
#list,#calls,#songs{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.item{padding:12px;background:rgba(0,0,0,.3);border-radius:12px;border:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center}
.item.cur{border-color:var(--ac)}
.actions{display:flex;gap:6px}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ac{background:#10b981;color:#fff}
.btn-dec{background:#ef4444;color:#fff}
#bar{height:6px;background:var(--bd);border-radius:3px;margin-top:14px}#bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px}
</style></head><body>

<h1>📻 Radio DJ Pro Studio</h1>

<!-- YouTube Deck -->
<div class="c"><h2>📺 YouTube Player Deck</h2>
<div id="yt-container"><div id="yt-player"></div></div>
<div class="input-row">
  <input id="ytUrl" placeholder="Lien YouTube ou ID (ex: jNQXAC9IVRw)...">
  <button onclick="loadYouTube()">Charger</button>
</div>
<button id="broadcastBtn" class="btn-live" onclick="toggleBroadcast()">🔊 Activer la diffusion YouTube</button>
</div>

<!-- Local Playlist -->
<div class="c"><h2>💽 Local MP3 Playlist</h2>
<div class="row">
  <label class="b">➕ Zid musique<input id="f" type="file" multiple hidden></label>
  <button id="pp" class="on" style="flex:1">▶ Play</button>
</div>
<canvas id="vz" width="600" height="70" style="width:100%;height:60px;margin-top:12px;background:#000;border-radius:8px"></canvas>
<div id="bar"><i></i></div>
<div id="list" style="margin-top:12px"><small style="color:var(--mu)">Zid chi ghnaya bach tbda…</small></div>
</div>

<!-- Friend Calls Management -->
<div class="c"><h2>📞 Demandes d'Appel (Live)</h2>
<div id="calls"><small style="color:var(--mu)">Aucun appel en attente…</small></div>
</div>

<!-- Song Requests & Polls -->
<div class="c"><h2>🎵 Sondage & Demandes d'auditeurs</h2>
<div id="songs"><small style="color:var(--mu)">Pas de propositions pour le moment…</small></div>
</div>

<!-- LiveKit Config -->
<div class="c"><h2>🔐 LiveKit Broadcast</h2>
<div class="row">
  <input id="rm" value="radio" placeholder="Smiyt radio">
  <input id="key" type="password" placeholder="Mot de passe DJ">
</div>
<div class="row" style="margin-top:8px">
  <button id="chk" style="flex:1">🔎 Vérifier</button>
  <button id="live" class="on" style="flex:1">🔴 Go Live</button>
</div>
<small id="ls" style="display:block;margin-top:8px;color:var(--mu)">Prêt à diffuser.</small>
<div id="lnk" style="margin-top:8px;word-break:break-all"></div>
</div>

<script>
let player;
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{width:'100%',height:'100%',events:{onReady:()=>console.log('YT Ready')}});
}
const tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";
const firstScriptTag=document.getElementsByTagName('script')[0];firstScriptTag.parentNode.insertBefore(tag,firstScriptTag);

const $=id=>document.getElementById(id);
let ctx,audioEle,srcNode,gainNode,analyser,streamDest,recorder,broadcastStream=null;
let tracks=[],curIdx=-1,isPlaying=false;
let room=null,callsMap=new Map(),songsMap=new Map();

function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  audioEle=new Audio();audioEle.crossOrigin="anonymous";audioEle.loop=false;
  srcNode=ctx.createMediaElementSource(audioEle);gainNode=ctx.createGain();
  analyser=ctx.createAnalyser();analyser.fftSize=128;
  streamDest=ctx.createMediaStreamDestination();
  srcNode.connect(gainNode);gainNode.connect(ctx.destination);
  gainNode.connect(streamDest);gainNode.connect(analyser);
  audioEle.onended=()=>playNext();
}

function loadYouTube(){
  const input=$('ytUrl').value.trim();
  let id=input;
  if(input.includes('youtu.be/'))id=input.split('youtu.be/')[1].split('?')[0];
  else if(input.includes('v='))id=input.split('v=')[1].split('&')[0];
  if(player&&id)player.loadVideoById(id);
}

async function toggleBroadcast(){
  const btn=$('broadcastBtn');
  if(!broadcastStream){
    try{
      const vidStream=document.querySelector('iframe').captureStream();
      const micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      const audioTrack=new AudioContext().createMediaStreamDestination().stream.getAudioTracks()[0]; // dummy
      const mergedCtx=new AudioContext();
      const s1=mergedCtx.createMediaStreamSource(vidStream);
      const s2=micStream.getAudioTracks().length ? mergedCtx.createMediaStreamSource(micStream) : null;
      const dest=mergedCtx.createMediaStreamDestination();
      s1.connect(dest);if(s2)s2.connect(dest);
      broadcastStream=dest.stream;
      if(room&&broadcastStream) await room.localParticipant.publishTrack(broadcastStream.getAudioTracks()[0],{name:'broadcast'});
      btn.textContent="⏹ Arrêter la diffusion";
      btn.style.background="#ef4444";
    }catch(e){alert("Erreur capture audio/video: "+e.message)}
  }else{
    broadcastStream=null;
    btn.textContent="🔊 Activer la diffusion YouTube";
    btn.style.background="linear-gradient(90deg,var(--ac),var(--ac2))";
  }
}

// Local Playlist Logic
$('f').onchange=e=>{
  [...e.target.files].forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
  renderPlaylist();
  if(!isPlaying&&tracks.length>0)playTrack(0);
};

function renderPlaylist(){
  const list=$('list');
  if(!tracks.length){list.innerHTML='<small style="color:var(--mu)">Zid chi ghnaya bach tbda…</small>';return;}
  list.innerHTML=tracks.map((t,i)=>`
    <div class="item ${i===curIdx?'cur':''}">
      <span>${i+1}. ${t.name}</span>
      <button class="btn-sm" onclick="playTrack(${i})">▶ Play</button>
    </div>
  `).join('');
}

function playTrack(i){
  initAudio();ctx.resume();
  curIdx=i;audioEle.src=tracks[i].url;audioEle.play();isPlaying=true;
  renderPlaylist();$('pp').textContent='⏸ Pause';
}

$('pp').onclick=()=>{
  if(!audioEle)return;
  if(isPlaying){audioEle.pause();isPlaying=false;$('pp').textContent='▶ Play'}
  else{audioEle.play();isPlaying=true;$('pp').textContent='⏸ Pause'}
};

function playNext(){
  if(tracks.length>0){curIdx=(curIdx+1)%tracks.length;playTrack(curIdx);}
}

// LiveKit & Data Channels
async function api(path,body,key){
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...(body||{}),key:key||''})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
}

async function check(){
  const key=$('key').value.trim();if(!key){alert('Entrez le mot de passe DJ');return false;}
  try{await api('/api/check',{},key); $('ls').textContent="✅ LiveKit Connecté"; return true;}
  catch(e){$('ls').textContent="❌ Erreur: "+e.message;return false;}
}

async function goLive(){
  if(!await check())return;
  const L=LivekitClient;
  try{
    const j=await api('/api/token',{role:'host',room:$('rm').value.trim()||'radio'},$('key').value.trim());
    room=new L.Room();
    room.on(L.RoomEvent.DataReceived,(payload,p)=>{
      try{
        const msg=JSON.parse(new TextDecoder().decode(payload));
        if(msg.type==='call_req'){callsMap.set(msg.id,{name:msg.name,p});renderCalls();}
        if(msg.type==='call_end'){callsMap.delete(msg.id);renderCalls();}
        if(msg.type==='new_song'){songsMap.set(msg.song.id,msg.song);renderSongs();}
        if(msg.type==='vote_song'){const s=songsMap.get(msg.id);if(s){s.votes++;renderSongs();}}
        if(msg.type==='ask_sync'){sendData({type:'sync_songs',songs:Array.from(songsMap.values())});}
      }catch(e){}
    });
    await room.connect(j.url,j.token);
    const dummyCtx=new AudioContext();
    const osc=dummyCtx.createOscillator();
    const dst=dummyCtx.createMediaStreamDestination();
    osc.connect(dst);
    await room.localParticipant.publishTrack(dst.stream.getAudioTracks()[0],{name:'master'});
    $('live').textContent="🔴 En Direct";$('live').style.background="#ef4444";
  }catch(e){alert("LiveKit Error: "+e.message)}
}

function sendData(obj){
  if(room&&room.state==='connected'){
    const data=new TextEncoder().encode(JSON.stringify(obj));
    room.localParticipant.publishData(data,{reliable:true});
  }
}

window.acceptCall=async(id)=>{
  const c=callsMap.get(id);
  if(c){
    c.p.setMicrophoneEnabled(true);
    sendData({type:'call_accept',id});
    callsMap.delete(id);renderCalls();
  }
};

window.kickCall=async(id)=>{
  sendData({type:'call_kick',id});
  callsMap.delete(id);renderCalls();
};

function renderCalls(){
  const box=$('calls');
  if(!callsMap.size){box.innerHTML='<small style="color:var(--mu)">Aucun appel en attente…</small>';return;}
  box.innerHTML=Array.from(callsMap.entries()).map(([id,c])=>`
    <div class="item">
      <span>🎙 ${c.name}</span>
      <div class="actions">
        <button class="btn-sm btn-ac" onclick="acceptCall('${id}')">Accepter</button>
        <button class="btn-sm btn-dec" onclick="kickCall('${id}')">Rejeter</button>
      </div>
    </div>
  `).join('');
}

function renderSongs(){
  const box=$('songs');
  if(!songsMap.size){box.innerHTML='<small style="color:var(--mu)">Pas de propositions pour le moment…</small>';return;}
  const sorted=Array.from(songsMap.values()).sort((a,b)=>b.votes-a.votes);
  box.innerHTML=sorted.map(s=>`
    <div class="item">
      <div>
        <strong>${s.title}</strong><br><small style="color:var(--mu)">Proposé par: ${s.by} | 👍 ${s.votes}</small>
      </div>
      <button class="btn-sm on" onclick="loadAndPlaySong('${s.title}')">Play</button>
    </div>
  `).join('');
}

window.loadAndPlaySong=(title)=>{
  $('ytUrl').value=title;
  loadYouTube();
};

$('chk').onclick=check;
$('live').onclick=()=>room?room.disconnect():goLive();

// Visualizer Loop
let an;
(function draw(){
  requestAnimationFrame(draw);
  const c=$('vz');if(!c)return;const x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  if(!analyser)return;
  const d=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(d);
  const w=c.width/d.length;
  x.fillStyle='#ff4d8d';
  d.forEach((v,i)=>{const h=v/255*c.height;x.fillRect(i*w+1,c.height-h,w-2,h)});
})();
</script></body></html>
