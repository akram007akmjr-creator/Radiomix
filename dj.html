<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📻 Radio Live Studio</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#111;--ac:#00ffcc;--tx:#fff;}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;margin:0;padding:15px;}
.card{background:#1d1d1f;border-radius:12px;padding:15px;margin-bottom:15px;}
button{background:var(--ac);color:#000;border:none;padding:10px 15px;font-weight:bold;border-radius:6px;cursor:pointer;}
input{background:#333;color:#fff;border:1px solid #444;padding:8px;border-radius:6px;width:calc(100% - 100px);}
.playlist{max-height:150px;overflow-y:auto;margin:10px 0;}
.track{padding:8px;background:#252527;margin-bottom:5px;border-radius:4px;display:flex;justify-content:space-between;}
</style>
</head>
<body>

<h1>📻 Radio Live Studio</h1>

<div class="card">
  <h2>📺 YouTube Sync</h2>
  <div style="display:flex;gap:10px;">
    <input id="ytUrl" placeholder="ID ou Lien YouTube...">
    <button onclick="loadYT()">Charger</button>
  </div>
</div>

<div class="card">
  <h2>💽 Lecteur MP3</h2>
  <input type="file" id="mp3Input" multiple>
  <div class="playlist" id="playlist">Aucune piste</div>
  <button id="playBtn" onclick="togglePlay()">▶ Play</button>
  <button onclick="nextTrack()">⏭ Next</button>
</div>

<div class="card">
  <h2>📡 LiveKit Broadcast</h2>
  <input id="roomName" placeholder="Room name" value="radio">
  <input id="apiKey" type="password" placeholder="API Key">
  <button id="broadcastBtn" onclick="toggleBroadcast()">🔴 Go Live</button>
  <p id="status">Prêt</p>
</div>

<script>
let player, ctx, audioStack = [], currentTrackIndex = -1, isPlaying = false;
let room, localAudioTrack;

// YouTube Iframe API
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytPlayer', { height: '200', width: '100%', videoId: 'jfKfPfyJRdk' });
}

function loadYT() {
  const input = document.getElementById('ytUrl').value;
  const id = input.includes('v=') ? input.split('v=')[1].split('&')[0] : input;
  if(player) player.loadVideoById(id);
}

// Audio Handling
const mp3Input = document.getElementById('mp3Input');
mp3Input.addEventListener('change', (e) => {
  audioStack = Array.from(e.target.files);
  renderPlaylist();
});

function renderPlaylist() {
  const container = document.getElementById('playlist');
  container.innerHTML = audioStack.map((f, i) => 
    `<div class="track"><span>${i+1}. ${f.name}</span></div>`
  ).join('');
}

function togglePlay() {
  if (audioStack.length === 0) return;
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (currentTrackIndex === -1) currentTrackIndex = 0;
  
  const audioElement = new Audio(URL.createObjectURL(audioStack[currentTrackIndex]));
  const trackSource = ctx.createMediaElementSource(audioElement);
  trackSource.connect(ctx.destination);
  
  if (isPlaying) {
    audioElement.pause();
    document.getElementById('playBtn').innerText = '▶ Play';
  } else {
    audioElement.play();
    document.getElementById('playBtn').innerText = '⏸ Pause';
  }
  isPlaying = !isPlaying;
}

function nextTrack() {
  if (audioStack.length > 0) {
    currentTrackIndex = (currentTrackIndex + 1) % audioStack.length;
    isPlaying = false;
    togglePlay();
  }
}

async function toggleBroadcast() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  const dest = ctx.createMediaStreamDestination();
  const roomName = document.getElementById('roomName').value;
  const key = document.getElementById('apiKey').value;
  
  if(!key) { alert('Clé requise'); return; }

  try {
    const response = await fetch('/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ room: roomName, key: key })
    });
    const data = await response.json();
    
    room = new LivekitClient.Room();
    await room.connect(data.url, data.token);
    await room.localParticipant.publishTrack(dest.stream.getAudioTracks()[0]);
    document.getElementById('status').innerText = "🟢 En Direct";
  } catch (err) {
    document.getElementById('status').innerText = "🔴 Erreur: " + err.message;
  }
}
</script>
</body>
</html>
